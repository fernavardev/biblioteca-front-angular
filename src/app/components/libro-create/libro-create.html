<h2>Registrar nuevo libro</h2>

<form class="formulario-libro" (ngSubmit)="guardarLibro()">
  <div class="campo">
    <label for="titulo">Título:</label>
    <input
      type="text"
      id="titulo"
      name="titulo"
      [(ngModel)]="nuevoLibro.titulo"
      required
    />
  </div>

  <div class="campo">
    <label for="autor">Autor:</label>
    <input
      type="text"
      id="autor"
      name="autor"
      [(ngModel)]="nuevoLibro.autor"
      required
    />
  </div>

  <div class="campo">
    <label for="anioPublicacion">Año de publicación:</label>
    <input
      type="number"
      id="anioPublicacion"
      name="anioPublicacion"
      [(ngModel)]="nuevoLibro.anioPublicacion"
      required
    />
  </div>

  <div class="campo">
    <label for="genero">Género:</label>
    <input
      type="text"
      id="genero"
      name="genero"
      [(ngModel)]="nuevoLibro.genero"
      required
    />
  </div>

  <div class="formulario-acciones">
    <button type="submit">Guardar libro</button>
  </div>
</form>
