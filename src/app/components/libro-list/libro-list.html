<h2>Listado de libros</h2>

@if (libros().length > 0) {
  <div class="lista-libros">
    @for (libro of libros(); track libro.id) {
      <div class="libro-item">
        <div class="libro-info">
          <a [routerLink]="['/libros', libro.id]">
            {{ libro.titulo }}
          </a>
          <p>{{ libro.autor }}</p>
        </div>

        <div class="libro-acciones">
          <a [routerLink]="['/libros', libro.id]">
            Ver detalle
          </a>

          <a [routerLink]="['/libros', libro.id, 'editar']">
            Editar
          </a>

          <button type="button" (click)="eliminarLibro(libro.id)">
            Eliminar
          </button>
        </div>
      </div>
    }
  </div>
} @else {
  <p>No hay libros para mostrar.</p>
}
