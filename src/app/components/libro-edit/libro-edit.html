<h2>Editar libro</h2>

@if (libro(); as libroActual) {
  <form class="formulario-libro" (ngSubmit)="guardarCambios()">

    <div class="campo">
      <label for="titulo">Título:</label>
      <input
        type="text"
        id="titulo"
        name="titulo"
        [(ngModel)]="libroActual.titulo"
        required
      />
    </div>

    <div class="campo">
      <label for="autor">Autor:</label>
      <input
        type="text"
        id="autor"
        name="autor"
        [(ngModel)]="libroActual.autor"
        required
      />
    </div>

    <div class="campo">
      <label for="anioPublicacion">Año de publicación:</label>
      <input
        type="number"
        id="anioPublicacion"
        name="anioPublicacion"
        [(ngModel)]="libroActual.anioPublicacion"
        required
      />
    </div>

    <div class="campo">
      <label for="genero">Género:</label>
      <input
        type="text"
        id="genero"
        name="genero"
        [(ngModel)]="libroActual.genero"
        required
      />
    </div>

    <div class="formulario-acciones">
      <button type="submit">Actualizar libro</button>
    </div>

  </form>
} @else {
  <p>No hay información del libro para editar.</p>
}
